[project]
name = "orapa-mine-solo"
version = "0.1.0"
description = "Orapa Mine en solo contre l'ordinateur, en Python/Pygame"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Clément Linarès" }]
keywords = ["jeu", "puzzle", "déduction", "pygame", "orapa-mine"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Games/Entertainment :: Puzzle Games",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
]
dependencies = [
    "pygame>=2.5",
]

[project.scripts]
orapa-mine = "orapa_mine.main:main"

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
